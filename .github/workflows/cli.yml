# The Node engine is HyperSend's Linux and Windows implementation. This CI
# matrix runs the identical engine tests on all three platforms on every
# push, so "same protocol, same logic, no change" is checked by machines,
# not asserted by docs.
name: cli

on:
  push:
    paths:
      - "src/**"
      - "bin/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "src/**"
      - "bin/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cli.yml"
  workflow_dispatch:

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: smoke (send + verify)
        # End-to-end over loopback: build, receive in background, send, cmp.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          node dist/cli.js receive .smoke-rx --no-beacon &
          sleep 2
          node dist/cli.js send README.md --to 127.0.0.1 &
          wait
          cmp README.md .smoke-rx/README.md && echo "SMOKE OK"
        timeout-minutes: 3
      - name: smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $job = Start-Process -FilePath node -ArgumentList 'dist/cli.js','receive','.smoke-rx','--no-beacon' -PassThru -NoNewWindow
          Start-Sleep -Seconds 2
          node dist/cli.js send README.md --to 127.0.0.1
          if ((Get-FileHash README.md).Hash -ne (Get-FileHash .smoke-rx/README.md).Hash) { throw "SMOKE MISMATCH" }
          "SMOKE OK"
        timeout-minutes: 3
